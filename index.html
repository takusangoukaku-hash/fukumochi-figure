<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ふくもちフィギュア</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  :root {
    --bg: #efe6da; --panel: #f8f2ea; --fg: #2b211a; --muted: #7a685a; --accent: #3a2415; --accent-fg: #fff6ea; --line: #d9ccbb; --bad: #a33a2a;
    --display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
    --body: "Zen Maru Gothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1713; --panel: #2a221c; --fg: #f1e8dd; --muted: #b3a493; --accent: #e9d7c3; --accent-fg: #2b211a; --line: #4a3d32; --bad: #f0a08f; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #1d1713; --panel: #2a221c; --fg: #f1e8dd; --muted: #b3a493; --accent: #e9d7c3; --accent-fg: #2b211a; --line: #4a3d32; --bad: #f0a08f; color-scheme: dark }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); display: flex; flex-direction: column; }
  /* 合言葉の入力 */
  #gate { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
  #gate form { width: min(100%, 360px); display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 24px 20px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  #gate h1 { margin: 0; font: 700 22px/1.3 var(--display); }
  #gate p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
  #gate input { font: 500 18px var(--body); padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; box-sizing: border-box; }
  #gate button { font: 700 16px var(--display); padding: 12px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  #gate button[disabled] { opacity: .6; }
  #err { color: var(--bad); min-height: 1.2em; }
  /* 3D 表示 */
  #stage { display: none; flex: 1; flex-direction: column; min-height: 0; }
  #stage.on { display: flex; }
  model-viewer { flex: 1 1 auto; width: 100%; min-height: 50vh; background: var(--bg); --poster-color: var(--bg); }
  .ar-button { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); font: 700 16px var(--display); padding: 12px 22px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-fg); box-shadow: 0 6px 18px rgba(0,0,0,.18); cursor: pointer; }
  .views { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); }
  .views button { font: 500 13px var(--body); padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  #loading { position: absolute; inset: 0; display: none; place-items: center; color: var(--muted); font-size: 14px; pointer-events: none; }
  #loading.on { display: grid; }
  footer { padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; background: var(--panel); border-top: 1px solid var(--line); }
  footer h1 { margin: 0; font: 700 22px/1.2 var(--display); }
  footer p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); max-width: 40em; }
  /* 切り替えボタン(ポーズ・ARでの大きさ) */
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 2px 0; }
  .row .label { font: 700 13px var(--body); color: var(--fg); min-width: 7em; }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--bg); }
  .seg button { font: 500 14px var(--body); padding: 8px 14px; border: 0; background: transparent; color: var(--fg); cursor: pointer; font-variant-numeric: tabular-nums; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .seg button[disabled] { opacity: .5; }
</style>
</head>
<body>
<div id="gate">
  <form id="form">
    <h1>ふくもち フィギュア</h1>
    <p>合言葉を入れると、3Dのふくもちが見られます。</p>
    <!-- type="password" だとスマホで日本語が打てないので、ふつうの文字欄にする(予測変換・自動大文字化は切る) -->
    <input id="pw" type="text" lang="ja" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="合言葉" required>
    <button id="go" type="submit">ひらく</button>
    <p id="err" role="alert"></p>
  </form>
</div>
<div id="stage">
  <model-viewer id="mv" loading="eager" alt="ふくもちの3Dフィギュア" camera-controls auto-rotate auto-rotate-delay="1500" rotation-per-second="18deg"
    ar ar-modes="webxr quick-look" ar-scale="fixed" ar-placement="floor"
    shadow-intensity="0.7" shadow-softness="0.8" exposure="1.0" environment-image="neutral"
    camera-orbit="35deg 78deg 105%" min-camera-orbit="auto auto 50%" max-camera-orbit="auto auto 300%" field-of-view="28deg" interaction-prompt="none">
    <div class="views">
      <button type="button" data-orbit="0deg 80deg 105%">正面</button>
      <button type="button" data-orbit="90deg 80deg 105%">左</button>
      <button type="button" data-orbit="180deg 80deg 105%">後ろ</button>
      <button type="button" data-orbit="-90deg 80deg 105%">右</button>
      <button type="button" data-orbit="35deg 20deg 105%">上から</button>
    </div>
    <div id="loading">読み込んでいます…</div>
    <button type="button" slot="ar-button" class="ar-button">ARで部屋に置く</button>
  </model-viewer>
  <footer>
    <h1>ふくもち フィギュア</h1>
    <p>指で回して、広げて拡大できます。フルカラー3Dプリント用のデータです。</p>
    <div class="row" id="pose-row">
      <span class="label" id="pose-label">ポーズ</span>
      <div class="seg" id="poses" role="group" aria-labelledby="pose-label"></div>
    </div>
    <div class="row">
      <span class="label" id="size-label">ARでの大きさ</span>
      <div class="seg" id="sizes" role="group" aria-labelledby="size-label"></div>
    </div>
    <p id="size-note"></p>
    <p id="ar-hint">「ARで部屋に置く」は、iPhone は Safari、Android(ARCore 対応機)は Chrome で開くと使えます。</p>
  </footer>
</div>

<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script>
(() => {
  const MODELS = [{"id":"stand","label":"立ち姿","base":10,"sizes":[10,15,20],"file":"data-stand.bin","ratio":1.2582},{"id":"paws","label":"前足に顔をのせて","base":5,"sizes":[5,7.5,10],"file":"data-paws.bin","ratio":2.6015}];
  const SALT = Uint8Array.from(atob("lJWSWNK4yjDGGRPJgRVIJA=="), (c) => c.charCodeAt(0));
  const ITER = 300000;
  const $ = (id) => document.getElementById(id);
  const form = $("form"), pw = $("pw"), go = $("go"), err = $("err"), mv = $("mv"), note = $("size-note"), loading = $("loading");
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

  let key = null;          // 合言葉から作った鍵
  const srcCache = {};     // モデルごとの表示用アドレス(一度ほどいたら使い回す)
  let current = null;      // 表示中のモデル

  async function deriveKey(passphrase) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(passphrase.normalize("NFKC")), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: SALT, iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }

  // 暗号化された1モデルを取ってきて、ほどいて、model-viewer に渡せるアドレスにする
  async function openModel(model, k) {
    if (srcCache[model.id]) return srcCache[model.id];
    const enc = new Uint8Array(await (await fetch(model.file)).arrayBuffer());
    const plain = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: enc.slice(0, 12) }, k, enc.slice(12)));   // 合言葉が違うとここで失敗する
    const tocLen = new DataView(plain.buffer).getUint32(0, true);
    const toc = JSON.parse(new TextDecoder().decode(plain.slice(4, 4 + tocLen)));
    const files = {}; let at = 4 + tocLen;
    for (const { name, size } of toc) { files[name] = plain.slice(at, at + size); at += size; }
    const urls = { "model.wasm": URL.createObjectURL(new Blob([files["model.wasm"]])), "texture.jpg": URL.createObjectURL(new Blob([files["texture.jpg"]], { type: "image/jpeg" })) };
    const gltf = JSON.parse(new TextDecoder().decode(files["model.json"]));
    for (const b of gltf.buffers ?? []) if (urls[b.uri]) b.uri = urls[b.uri];
    for (const im of gltf.images ?? []) if (urls[im.uri]) im.uri = urls[im.uri];
    return (srcCache[model.id] = URL.createObjectURL(new Blob([JSON.stringify(gltf)], { type: "model/gltf+json" })));
  }

  // ---- ポーズ ----
  const poses = $("poses");
  if (MODELS.length < 2) $("pose-row").hidden = true;
  for (const m of MODELS) {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.model = m.id; b.textContent = m.label; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => showModel(m.id).catch(showLoadError));
    poses.appendChild(b);
  }
  async function showModel(id) {
    // model-viewer の部品が読み込まれる前に src などを入れると無視されるので、準備ができるまで待つ
    await customElements.whenDefined("model-viewer");
    const m = MODELS.find((x) => x.id === id) ?? MODELS[0];
    for (const b of poses.querySelectorAll("button")) { b.setAttribute("aria-pressed", String(b.dataset.model === m.id)); b.disabled = true; }
    loading.classList.add("on");
    try {
      const src = await openModel(m, key);
      current = m;
      renderSizes();
      mv.src = src;
      mv.cameraOrbit = "35deg 78deg 105%"; mv.autoRotate = true;
      store.set("figure-model", m.id);
    } finally {
      for (const b of poses.querySelectorAll("button")) b.disabled = false;
      loading.classList.remove("on");
    }
  }
  function showLoadError() { note.textContent = "読み込めませんでした。通信状態を確認して、もう一度お試しください。"; }

  // ---- ARでの大きさ(3Dデータは base cm で作ってあるので、選んだ高さとの比で拡大縮小する) ----
  const sizes = $("sizes");
  function renderSizes() {
    sizes.textContent = "";
    for (const h of [...current.sizes, "free"]) {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.size = String(h); b.setAttribute("aria-pressed", "false");
      b.textContent = h === "free" ? "自由に" : "高さ" + h + "cm";
      b.addEventListener("click", () => setSize(String(h)));
      sizes.appendChild(b);
    }
    const saved = store.get("figure-size-" + current.id);
    setSize(saved && sizes.querySelector('[data-size="' + saved + '"]') ? saved : String(current.sizes[0] ?? current.base));
  }
  function setSize(choice) {
    for (const b of sizes.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.size === choice));
    if (choice === "free") {
      mv.scale = "1 1 1";
      mv.arScale = "auto";
      note.textContent = "ARで置いたあと、2本の指でつまんで好きな大きさにできます(はじめは高さ " + current.base + " cm)。";
    } else {
      const k = Number(choice) / current.base;
      mv.scale = k + " " + k + " " + k;
      mv.arScale = "fixed";
      note.textContent = "ARでは高さ " + choice + " cm(床からいちばん高い所まで)、前後の長さ約 " + (Number(choice) * current.ratio).toFixed(1) + " cm で床に置かれます。";
    }
    store.set("figure-size-" + current.id, choice);
  }
  mv.addEventListener("load", () => {
    if (!mv.canActivateAR) {
      const btn = mv.querySelector(".ar-button"); if (btn) btn.hidden = true;
      $("ar-hint").textContent = "この端末・ブラウザでは AR 表示は使えません。iPhone は Safari、Android(ARCore 対応機)は Chrome で開くと「ARで部屋に置く」が出ます。";
    }
  });

  // ---- 合言葉 ----
  async function unlock(passphrase) {
    const k = await deriveKey(passphrase);
    const first = MODELS.find((m) => m.id === store.get("figure-model")) ?? MODELS[0];
    await openModel(first, k);   // 合言葉の確認を兼ねる
    key = k;
    $("gate").style.display = "none";
    $("stage").classList.add("on");
    await showModel(first.id);
  }
  form.addEventListener("submit", async (e) => {
    e.preventDefault(); err.textContent = ""; go.disabled = true; go.textContent = "ひらいています…";
    const value = pw.value.trim();
    try { await unlock(value); store.set("figure-pw", value); }
    catch (ex) { err.textContent = ex.name === "OperationError" ? "合言葉が違うようです。" : "読み込めませんでした。通信状態を確認して、もう一度お試しください。"; }
    finally { go.disabled = false; go.textContent = "ひらく"; }
  });
  // この端末で一度ひらいたことがあれば、合言葉を入れ直さなくてよいようにする
  const saved = store.get("figure-pw");
  if (saved) { pw.value = saved; unlock(saved).catch(() => { pw.value = ""; }); }

  for (const b of document.querySelectorAll("[data-orbit]")) b.addEventListener("click", () => { mv.autoRotate = false; mv.cameraOrbit = b.dataset.orbit; mv.cameraTarget = "auto auto auto"; });
})();
</script>
</body>
</html>
